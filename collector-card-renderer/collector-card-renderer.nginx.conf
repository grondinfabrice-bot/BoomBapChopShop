# Add this location inside the existing HTTPS server block for boombapchopshop.art.
# The renderer still authenticates every request with its shared secret.
location = /internal/collector-card/render {
    limit_except POST { deny all; }
    client_max_body_size 12m;
    proxy_pass http://127.0.0.1:3032/render;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 5s;
    proxy_read_timeout 45s;
    proxy_send_timeout 45s;
    add_header Cache-Control "no-store" always;
}
